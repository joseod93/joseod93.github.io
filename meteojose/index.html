<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Redireccionando...</title>
</head>
<body>
    <p>Redireccionando...</p>
    <p id="manual" hidden>
        Si no te redirige automaticamente, haz
        <a id="enlace" href="http://217.154.188.26/dashboard.html">clic aqui</a>.
    </p>
    <noscript>
        <p>Activa JavaScript o haz
        <a href="http://217.154.188.26/dashboard.html">clic aqui</a>.</p>
    </noscript>
    <script> 
        var RESERVA = '217.154.188.26';

        function esIPv4(t) {
            var p = t.split('.');
            return p.length === 4 && p.every(function (o) {
                return /^\d{1,3}$/.test(o) && +o <= 255;
            });
        }

        function ir(ip) {
            var url = 'http://' + ip + '/dashboard.html';
            document.getElementById('enlace').href = url;
            document.getElementById('manual').hidden = false;
            location.replace(url);
        }

        fetch('../Vs/PI.txt', { cache: 'no-store' })
            .then(function (r) { return r.ok ? r.text() : Promise.reject(); })
            .then(function (t) {
                var ip = t.trim();
                ir(esIPv4(ip) ? ip : RESERVA);
            })
            .catch(function () { ir(RESERVA); });
    </script>
</body>
</html>
